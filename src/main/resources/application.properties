spring.application.name=Signal

# Claude API — 환경변수로 주입 (코드에 절대 하드코딩 금지)
claude.api.key=${CLAUDE_API_KEY}
claude.api.model=claude-sonnet-4-6
claude.api.url=https://api.anthropic.com/v1/messages

# 파이프라인 설정
# 테스트 시 3~5, 실운영 시 50 이상으로 조정
pipeline.news.max-items=50

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/signal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 스케줄러
pipeline.schedule.cron=0 0 9 * * MON-FRI
pipeline.watchlist[0].ticker=005930.KS
pipeline.watchlist[0].rssFeedUrl=https://www.hankyung.com/feed/all-news
pipeline.watchlist[0].rssFeedSource=한국경제
pipeline.watchlist[1].ticker=AAPL
pipeline.watchlist[1].rssFeedUrl=https://www.cnbc.com/id/100003114/device/rss/rss.html
pipeline.watchlist[1].rssFeedSource=CNBC

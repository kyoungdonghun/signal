spring.application.name=SignalTest

# Isolate automated tests from local MySQL and shell environment.
spring.datasource.url=jdbc:h2:mem:signal-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Keep external integrations inert during context boot for tests.
claude.api.key=test-key
claude.api.model.sonnet=claude-sonnet-test
claude.api.model.opus=claude-opus-test
claude.api.model.haiku=claude-haiku-test
claude.api.url=https://example.invalid/v1/messages

pipeline.news.max-items=3
pipeline.schedule.cron=0 0 9 * * MON-FRI
pipeline.watchlist[0].ticker=TEST
pipeline.watchlist[0].rssFeedUrl=https://example.invalid/rss
pipeline.watchlist[0].rssFeedSource=TEST
